# Sesh Configuration
# https://github.com/joshmedeski/sesh

# Default session directory
default_session_dir = "~"

# Startup session (optional)
# startup_session = "main"

# Session search paths (sesh will auto-discover projects here)
# These paths are used by sesh to find git repositories
[[session_path]]
path = "~/src/geo"
depth = 2

[[session_path]]
path = "~/src/pie"
depth = 2

[[session_path]]
path = "~/src/public"
depth = 2

[[session_path]]
path = "~/src/web"
depth = 2

[[session_path]]
path = "~/src/workspace"
depth = 2

# Icon mappings for different project types
[icons]
default = "📁"
git = "󰊢"
home = "󰋜"
config = ""
downloads = "󰇚"
documents = "󰈙"
zoxide = ""
tmux = ""
session = ""
